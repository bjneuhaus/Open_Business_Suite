[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-business-suite"
version = "0.1.0"
description = "Plattform zur Installation, Konfiguration und Verwaltung von Open-Source-Anwendungen (PoC)."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
